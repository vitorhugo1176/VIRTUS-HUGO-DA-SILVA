<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gerador de senha</title>
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="" alt="">
            <h2 class="titulo-principal">gerador de senhas</h2>
            <h3 class="titulo-secundario">gere intmtenemente uma senha aleatoria e segura </h3>
        </div>
        <div class="conteudo-senha">
            <label for="senha">senha</label>
            <input name="senha" type="text" id="campo-senha" readonly>
        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">Personalize a sua senha</h3>
            <div class="parametro-coluna_senha">
            <div class="parametro-senha">
                <h4 class="parametro-senha_titulo">Número de caracteres</h4>
                <div class="parametro-senha-botoes">
                    <button class="parametro-senha_botao">-</button>
                    <p class="parametro-senha_texto">12</p>
                    <button class="parametro-senha_botao"></button>
                   
                    </div>
                    <div class="parametro-senha">
                        <h4 class="parametro-senha_titulo"> características da senha </h4>
                        <div class="parametro-senha_checkbox">
                            <input name="maiusculo" type="checkbox" class="">
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </section>
</body>
